<!DOCTYPE html>
<html>
<head>
<title>Vendor Dues</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Cameras">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="stylesheet" href="/static/style.css">
</head>

<body class="with-logout-band">

<div class="header brand-band">
<h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
</div>

<div class="container">

<h2>Due to Vendors</h2>

<table class="records-table">

<thead>
<tr>
<th>Vendor</th>
<th>Equipment</th>
<th>Total</th>
<th>Paid</th>
<th>Balance</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for v in vendors %}

<tr>

<td>{{ v["vendor_name"] }}</td>

<td>{{ v["item_name"] }}</td>

<td>₹{{ v["total"] }}</td>

<td>₹{{ v["paid"] }}</td>

<td>₹{{ v["balance"] }}</td>

<td>

{% if v["balance"] > 0 %}

<form method="POST" action="/pay_vendor/{{ v['id'] }}">

<input type="number" name="payment" placeholder="Payment">

<button type="submit">Pay</button>

</form>

{% else %}

✅ Fully Paid

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<div class="bottom-logout-band">
<a href="/logout">Logout</a>
</div>

</body>
</html>
