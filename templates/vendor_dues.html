<!DOCTYPE html>
<html>
<head>
<title>Vendor Dues</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h2>Due to Vendors</h2>

<a href="/dashboard">← Back</a>

<br><br>

<table class="records-table">

<thead>
<tr>
<th>Vendor</th>
<th>Equipment</th>
<th>Total</th>
<th>Paid</th>
<th>Balance</th>
<th>Action</th>
</tr>
</thead>

<tbody>

{% for v in vendors %}

<tr>

<td>{{ v["vendor_name"] }}</td>

<td>{{ v["item_name"] }}</td>

<td>₹{{ v["total"] }}</td>

<td>₹{{ v["paid"] }}</td>

<td>₹{{ v["balance"] }}</td>

<td>

{% if v["balance"] > 0 %}

<form method="POST" action="/pay_vendor/{{ v['id'] }}">

<input type="number" name="payment" placeholder="Payment">

<button type="submit">Pay</button>

</form>

{% else %}

✅ Fully Paid

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
