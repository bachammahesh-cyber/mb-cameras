<!DOCTYPE html>
<html>
<head>
    <title>MB_Cameras Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MB Cameras">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header brand-band">
    <h2 class="brand-title"><a class="brand-home" href="/">MB CAMERAS</a></h2>
</div>

<div class="container">
    <h2>🎥 MB_Cameras</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>Demo login: <strong>{{ demo_username }}</strong> / <strong>{{ demo_password }}</strong></p>
</div>

</body>
</html>
