<!DOCTYPE html>
<html>

<head>
<title>New Rental</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="header">
    <h2>MB Cameras</h2>
    <a class="logout" href="/logout">Logout</a>
</div>

<div class="container">

<div class="box">

<h2>New Rental Entry</h2>

<form method="POST" action="/save_rental">

<label>Customer Name</label>
<input type="text" name="customer_name" required>

<label>Phone</label>
<input type="text" name="phone">

<label>Start Date</label>
<input type="date" name="start_date" required>

<label>End Date</label>
<input type="date" name="end_date" required>

<label>Advance Paid</label>
<input type="number" step="0.01" name="advance_paid" value="0">

<h3>Select Equipment</h3>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">

{% for item in items %}

<label style="background:#f8f9fa;padding:8px;border-radius:6px;">
<input type="checkbox" name="item_ids" value="{{item.id}}">
{{item.name}} (₹{{item.rent_per_day}})
</label>

{% endfor %}

</div>

<br>

<h3>Outside Equipment (Vendor)</h3>

<div id="vendor_section">

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">

<input type="text" name="vendor_name[]" placeholder="Vendor Name">

<input type="number" name="vendor_rates[]" placeholder="Rate per day">

</div>

</div>

<button type="button" onclick="addVendor()">Add Outside Equipment</button>

<br><br>

<button type="submit">Save Rental</button>

</form>

</div>

</div>

<script>

function addVendor(){

let div = document.createElement("div")

div.style.display="grid"
div.style.gridTemplateColumns="1fr 1fr"
div.style.gap="10px"
div.style.marginBottom="10px"

div.innerHTML = `

<input type="text" name="vendor_name[]" placeholder="Vendor Name">

<input type="number" name="vendor_rates[]" placeholder="Rate per day">

`

document.getElementById("vendor_section").appendChild(div)

}

</script>

</body>
</html>
