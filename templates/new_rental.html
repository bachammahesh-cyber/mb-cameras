<!DOCTYPE html>
<html>
<head>

<title>New Rental</title>
<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="header brand-band">

<h2 class="brand-title">MB CAMERAS</h2>

<a href="/dashboard">Back</a>

</div>


<div class="container">

<div class="card">

<h2>New Rental Entry</h2>

<form method="POST" action="/save_rental">


<label>Customer Name</label>
<input type="text" name="customer_name" required>


<label>Phone</label>
<input type="text" name="phone" required>


<label>Start Date</label>
<input type="date" name="start_date" required>


<label>End Date</label>
<input type="date" name="end_date" required>


<label>Advance Paid</label>
<input type="number" name="advance_paid" required>


</div>


<div class="card">

<h3>Our Equipment</h3>

<div class="equipment-grid">

{% for item in items %}

<label class="equipment-card">

<input type="checkbox" name="item_ids" value="{{item['id']}}">

<div class="equipment-info">

<div class="equipment-title">
{{item['name']}}
</div>

<div class="equipment-price">
₹{{item['rent_per_day']}} / day
</div>

</div>

<input
type="number"
class="vendor-price"
name="item_rates[{{item['id']}}]"
placeholder="Price"
value="{{item['rent_per_day']}}"
/>

</label>

{% endfor %}

</div>

</div>


<div class="card">

<h3>Outside Equipment (Vendor)</h3>

<label>Vendor Name</label>
<input type="text" name="vendor_name[]">


<div class="equipment-grid">

{% for item in items %}

<label class="equipment-card">

<input type="checkbox">

<div class="equipment-info">

<div class="equipment-title">
{{item['name']}}
</div>

</div>

<input
type="number"
class="vendor-price"
name="vendor_rates[]"
placeholder="Price"
/>

</label>

{% endfor %}

</div>

</div>


<div class="center">

<button type="submit">
Save Rental
</button>

</div>

</form>

</div>

</body>
</html>
