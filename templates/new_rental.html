<!DOCTYPE html>
<html>

<head>
<title>New Rental</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
<h2>MB Cameras</h2>
<a class="logout" href="/dashboard">Dashboard</a>
</div>

<div class="container">

<div class="box">

<h2>New Rental Entry</h2>

<form method="POST" action="/save_rental">

<h3>Customer Details</h3>

<label>Customer Name</label>
<input type="text" name="customer_name" required>

<label>Phone</label>
<input type="text" name="phone">

<label>Start Date</label>
<input type="date" name="start_date" required>

<label>End Date</label>
<input type="date" name="end_date" required>

<label>Advance Paid</label>
<input type="number" step="0.01" name="advance_paid" value="0">

</div>


<div class="box">

<h3>Our Equipment</h3>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">

{% for item in items %}

<label style="
display:flex;
align-items:center;
gap:10px;
background:#f8f9fa;
padding:10px;
border-radius:8px;
cursor:pointer;
">

<input type="checkbox" name="item_ids" value="{{item.id}}">

<span>
{{item.name}} (₹{{item.rent_per_day}})
</span>

</label>

{% endfor %}

</div>

</div>



<div class="box">

<h3>Outside Equipment (Vendor)</h3>

<label>Vendor Name</label>
<input type="text" name="vendor_name">

<div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:10px;">

{% for item in items %}

<div style="
display:flex;
align-items:center;
gap:10px;
background:#f8f9fa;
padding:10px;
border-radius:8px;
">

<input type="checkbox" name="outside_item_ids" value="{{item.id}}" onclick="togglePrice(this,'{{item.id}}')">

<span style="flex:1;">
{{item.name}}
</span>

<input
type="number"
step="0.01"
placeholder="Price"
name="vendor_price_{{item.id}}"
id="price_{{item.id}}"
style="width:120px;display:none;"
>

</div>

{% endfor %}

</div>

</div>


<div class="box">

<button type="submit">Save Rental</button>

</div>

</form>

</div>


<script>

function togglePrice(cb,id){

let field = document.getElementById("price_"+id)

if(cb.checked){
field.style.display="block"
}else{
field.style.display="none"
}

}

</script>

</body>
</html>
