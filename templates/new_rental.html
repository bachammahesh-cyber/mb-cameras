<!DOCTYPE html>
<html>
<head>
    <title>New Rental - MB_Cameras</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h2>🎥 New Rental Entry</h2>

<a href="/dashboard">← Back</a>

<br><br>

<form method="POST" action="/save_rental">

<!-- CUSTOMER DETAILS -->

<input type="text" name="customer_name" placeholder="Customer Name" required>

<input type="text" name="phone" placeholder="Phone Number" required>

<label>Start Date</label>
<input type="date" name="start_date" required>

<label>End Date</label>
<input type="date" name="end_date" required>

<hr>

<!-- YOUR EQUIPMENT -->

<h3>Your Equipment</h3>

{% for item in items %}

<label style="display:block; margin-bottom:6px;">
<input type="checkbox" name="item_ids" value="{{ item['id'] }}">
{{ item['name'] }} - ₹{{ item['rent_per_day'] }}/day
</label>

{% endfor %}

<hr>

<!-- OUTSIDE EQUIPMENT -->

<h3>Outside Equipment (Vendor)</h3>

<label>Vendor Name</label>
<input type="text" name="vendor_name">

<div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;">

{% for item in items %}

<div style="display:flex;align-items:center;gap:10px;background:#f8f9fa;padding:8px;border-radius:6px;">

<input type="checkbox" name="outside_item_ids" value="{{item.id}}" onclick="togglePrice(this, '{{item.id}}')">

<span style="flex:1;">
{{item.name}}
</span>

<input 
type="number" 
step="0.01" 
name="vendor_price_{{item.id}}" 
id="price_{{item.id}}" 
placeholder="Price"
style="width:120px;display:none;"
>

</div>

{% endfor %}

</div>

<button type="button" onclick="removeVendor(this)">
❌ Remove Vendor
</button>

</div>

</div>

<hr>

<input type="number" name="advance_paid" placeholder="Advance Paid" required>

<button type="submit">Confirm Rental</button>

</form>

</div>

<script>

function addVendor() {

const template = document.getElementById("vendorTemplate");

const clone = template.firstElementChild.cloneNode(true);

document.getElementById("outsideContainer").appendChild(clone);

}

function removeVendor(btn) {

btn.parentElement.remove();

}

</script>

<script>

function togglePrice(checkbox,id){

let priceField = document.getElementById("price_"+id)

if(checkbox.checked){
priceField.style.display="block"
}else{
priceField.style.display="none"
}

}

</script>
</body>
</html>
