<!DOCTYPE html>
<html>

<head>
<title>New Rental</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
<h2>MB Cameras</h2>
<a class="logout" href="/dashboard">Dashboard</a>
</div>

<div class="container">

<h1>New Rental Entry</h1>

<form method="POST" action="/save_rental">

<div class="card">

<h3>Customer Details</h3>

<label>Customer Name</label>
<input type="text" name="customer_name" required>

<label>Phone</label>
<input type="text" name="phone">

<label>Start Date</label>
<input type="date" name="start_date" required>

<label>End Date</label>
<input type="date" name="end_date" required>

<label>Advance Paid</label>
<input type="number" name="advance_paid" value="0">

</div>


<div class="card">

<h3>Our Equipment</h3>

<div class="equipment-grid">

{% for item in items %}

<label class="equipment-card">

<input type="checkbox" name="item_ids" value="{{item.id}}">

<span class="equipment-name">
{{item.name}} (₹{{item.rent_per_day}} / day)
</span>

</label>

{% endfor %}

</div>

</div>


<div class="card">

<h3>Outside Equipment (Vendor)</h3>

<label>Vendor Name</label>
<input type="text" name="vendor_name">

<div class="equipment-grid">

{% for item in items %}

<div class="equipment-card">

<input type="checkbox"
name="outside_item_ids"
value="{{item.id}}"
onclick="togglePrice('{{item.id}}')">

<span class="equipment-name">
{{item.name}}
</span>

<input
type="number"
step="0.01"
name="vendor_price_{{item.id}}"
id="price_{{item.id}}"
placeholder="₹"
class="vendor-price"
>

</div>

{% endfor %}

</div>

</div>


<div class="card center">

<button type="submit">Save Rental</button>

</div>

</form>

</div>


<script>

function togglePrice(id){

let field=document.getElementById("price_"+id)

if(field.style.display==="none" || field.style.display===""){
field.style.display="block"
}else{
field.style.display="none"
}

}

</script>

</body>
</html>
