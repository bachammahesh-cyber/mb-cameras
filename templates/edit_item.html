<!DOCTYPE html>
<html>
<head>

<title>Edit Equipment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">

</head>

<body class="with-logout-band">

<div class="header brand-band">
<h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
</div>

<div class="container">

<div class="card">

<h2 class="page-title">Edit Equipment</h2>

<form method="POST">

<label>Equipment Name</label>
<input type="text" name="name" value="{{ item.name }}" required>

<label>Category</label>
<input type="text" name="category" value="{{ item.category }}">

<label>Rent Per Day</label>
<input type="number" step="0.01" name="rent" value="{{ item.rent_per_day }}" required>

<label>Current Status</label>
<input type="text" value="{{ item.status }}" disabled>

<div class="center">
<button type="submit">Save Changes</button>
</div>

</form>

</div>

</div>

<div class="bottom-logout-band">
<a href="/logout">Logout</a>
</div>

</body>
</html>
