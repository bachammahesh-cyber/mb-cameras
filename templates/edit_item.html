<!DOCTYPE html>
<html>
<head>

<title>Edit Equipment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Cameras">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="stylesheet" href="/static/style.css">

</head>

<body class="with-logout-band">

<div class="header brand-band">
<h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
</div>

<div class="container">

<div class="card">

<a href="/inventory" class="back-link">← Inventory</a>
<h2 class="page-title">Edit Equipment</h2>

<form method="POST">

<label>Quick ID <span style="font-weight:400;color:#888;font-size:12px;">— short code for Quick Entry (e.g. s3, tripod1)</span></label>
<input type="text" name="custom_id" value="{{ item.custom_id or '' }}" placeholder="e.g. s3" maxlength="20" style="text-transform:lowercase;">

<label>Equipment Name</label>
<input type="text" name="name" value="{{ item.name }}" required>

<label>Category</label>
<input type="text" name="category" value="{{ item.category }}">

<label>Rent Per Day</label>
<input type="number" step="0.01" name="rent" value="{{ item.rent_per_day }}" required>

<label>Current Status</label>
<input type="text" value="{{ item.status }}" disabled>

<div class="center">
<button type="submit">Save Changes</button>
</div>

</form>

</div>

</div>

{% include "_nav.html" %}

</body>
</html>
