<!DOCTYPE html>
<html>
<head>

<title>Edit Client</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Cameras">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="stylesheet" href="/static/style.css">

</head>

<body class="with-logout-band">

<div class="header brand-band">
<h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
</div>

<div class="container">

<div class="card">

<h2 class="page-title">Edit Client</h2>

<form method="POST">

<label>Client Name</label>
<input type="text" name="name" value="{{ client.name }}" required>

<label>Phone Number</label>
<input type="text" name="phone" value="{{ client.phone }}" required>

<label>Address</label>
<textarea name="address" rows="3" required>{{ client.address }}</textarea>

<div class="center">
<button type="submit">Save Changes</button>
</div>

</form>

</div>

</div>

<div class="bottom-logout-band">
<a href="/logout">Logout</a>
</div>

</body>
</html>
