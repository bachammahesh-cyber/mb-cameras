<!DOCTYPE html>
<html>
<head>

<title>Dashboard - MB_Cameras</title>
<link rel="stylesheet" href="/static/style.css">

<style>

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:30px;
}

.card{

background:#1e1e1e;
padding:30px;
border-radius:10px;
text-align:center;
font-size:20px;

}

.card a{
text-decoration:none;
color:white;
}

.card:hover{
background:#ff4d00;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Welcome {{ username }}</h2>

<a href="/logout">Logout</a>

<div class="grid">

<div class="card">
<a href="/new_rental">
➕ Make Rental Entry
</a>
</div>

<div class="card">
<a href="/inventory">
📦 Inventory
</a>
</div>

<div class="card">
<a href="/rental_records">
📊 Rental Records
</a>
</div>

<div class="card">
<a href="/credit_report">
💳 Financials
</a>
</div>

</div>

</div>

</body>
</html>
