<!DOCTYPE html>
<html>
<head>
<title>Generate Invoice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Cameras">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="with-logout-band">
<div class="header brand-band">
  <h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
</div>
<div class="container">
<h2 class="page-title">Generate Invoice</h2>
<div class="filter-bar" style="margin-bottom:12px;">
  <input type="text" id="search" placeholder="Search customer or ID…" oninput="applyFilter()">
  <div class="status-filters">
    <button class="filter-btn active" id="btn-month" onclick="setPeriod('month')"></button>
    <button class="filter-btn" id="btn-all" onclick="setPeriod('all')">All Time</button>
  </div>
  <div class="date-filters">
    <input type="date" id="filter-from" onchange="onDateChange()" title="From">
    <span>–</span>
    <input type="date" id="filter-to" onchange="onDateChange()" title="To">
  </div>
  <select class="mob-drop" id="mob-period" onchange="mobPeriod(this.value)">
    <option value="month" id="mob-opt"></option>
    <option value="all">All Time</option>
    <option value="custom">Custom…</option>
  </select>
  <div class="mob-date-row" id="mob-dates" style="display:none;">
    <input type="date" id="mob-from" onchange="mobDate()">
    <span>–</span>
    <input type="date" id="mob-to" onchange="mobDate()">
  </div>
</div>
<table class="records-table" id="inv-pick-table">
<thead>
<tr><th>Date</th><th>ID</th><th>Customer</th><th>Amount</th><th></th></tr>
</thead>
<tbody id="inv-tbody">
{% for r in rentals %}
<tr data-search="{{ r.customer_name | lower }} {{ r.id }}" data-date="{{ r.start_date }}">
  <td>{{ r.start_date | fmt_date }}</td>
  <td>{{ r.id }}</td>
  <td>{{ r.customer_name }}</td>
  <td>{{ r.total_amount }}</td>
  <td><a href="/invoice/new/{{ r.id }}?from=/generate_invoice" class="btn-sm">Generate Invoice</a></td>
</tr>
{% endfor %}
</tbody>
</table>
<p id="no-results" style="display:none;padding:10px;color:#888;">No entries match.</p>
</div>
{% include "_nav.html" %}
<script>
const now = new Date();
const MONTH_LABEL = now.toLocaleString('default', { month: 'long' }) + ' ' + now.getFullYear();
document.getElementById('mob-opt').textContent = MONTH_LABEL;
document.getElementById('btn-month').textContent = MONTH_LABEL;

function getMonthRange() {
    const y = now.getFullYear(), m = now.getMonth();
    return { from: new Date(y,m,1).toISOString().slice(0,10), to: new Date(y,m+1,0).toISOString().slice(0,10) };
}

let dateFrom = '', dateTo = '';

function setPeriod(mode) {
    if (mode === 'month') { const r = getMonthRange(); dateFrom = r.from; dateTo = r.to; document.getElementById('filter-from').value = dateFrom; document.getElementById('filter-to').value = dateTo; }
    else { dateFrom = ''; dateTo = ''; document.getElementById('filter-from').value = ''; document.getElementById('filter-to').value = ''; }
    document.getElementById('btn-month').classList.toggle('active', mode === 'month');
    document.getElementById('btn-all').classList.toggle('active', mode === 'all');
    applyFilter();
}

function onDateChange() {
    dateFrom = document.getElementById('filter-from').value;
    dateTo   = document.getElementById('filter-to').value;
    document.getElementById('btn-month').classList.remove('active');
    document.getElementById('btn-all').classList.remove('active');
    applyFilter();
}

function applyFilter() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    let vis = 0;
    document.querySelectorAll('#inv-tbody tr').forEach(row => {
        const date = row.dataset.date || '';
        const show = (!dateFrom || date >= dateFrom) && (!dateTo || date <= dateTo)
            && (!q || (row.dataset.search || '').includes(q));
        row.style.display = show ? '' : 'none';
        if (show) vis++;
    });
    document.getElementById('no-results').style.display = vis === 0 ? '' : 'none';
}

function mobPeriod(val) {
    const dr = document.getElementById('mob-dates');
    if (val === 'month') { setPeriod('month'); dr.style.display = 'none'; }
    else if (val === 'all') { setPeriod('all'); dr.style.display = 'none'; }
    else { dr.style.display = 'flex'; }
}
function mobDate() {
    document.getElementById('filter-from').value = document.getElementById('mob-from').value;
    document.getElementById('filter-to').value   = document.getElementById('mob-to').value;
    onDateChange();
}

setPeriod('month');
</script>
</body>
</html>
