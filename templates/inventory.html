<!DOCTYPE html>
<html>

<head>
<title>Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>

<body class="with-logout-band">

<div class="header brand-band">
    <h2 class="brand-title"><a class="brand-home" href="/dashboard">MB CAMERAS</a></h2>
    <a class="header-action" href="/dashboard">Dashboard</a>
</div>

<div class="container">

<div class="box">

<h2>Add Equipment</h2>

<form method="POST" action="/add_item">

<label>Equipment Name</label>
<input name="name" required>

<label>Category</label>
<input name="category">

<label>Rent Per Day</label>
<input type="number" step="0.01" name="rent">

<button type="submit">Add Equipment</button>

</form>

</div>


<div class="box">

<h2>Inventory List</h2>

<table class="records-table">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Category</th>
<th>Rent / Day</th>
<th>Status</th>
</tr>
</thead>

<tbody>

{% for item in items %}

<tr>
<td>{{ item.id }}</td>
<td>{{ item.name }}</td>
<td>{{ item.category }}</td>
<td>₹{{ item.rent_per_day }}</td>
<td>{{ item.status }}</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<div class="bottom-logout-band">
<a href="/logout">Logout</a>
</div>

</body>
</html>
