services:
  - type: web
    name: mb-cameras
    runtime: python
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 2 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -"
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
